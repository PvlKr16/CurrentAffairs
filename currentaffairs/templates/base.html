{% load static %}
<!DOCTYPE html>
<html lang="en"
      data-theme="{% if request.user.is_authenticated %}{{ request.user.color_scheme|default:'emerald' }}{% else %}emerald{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CurrentAffairs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    {% block extra_css %}{% endblock %}
</head>

    <script src="{% static 'js/search.js' %}"></script>
    <script src="{% static 'js/password-toggle.js' %}"></script>

<body>

{% if request.user.is_authenticated %}
    {% include 'components/header.html' %}
{% endif %}

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/unread.js' %}"></script>
<script src="{% static 'js/theme-switcher.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
