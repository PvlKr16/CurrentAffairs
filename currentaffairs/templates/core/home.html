{% extends 'base.html' %}

{% block content %}

<h3>Topics</h3>

{% for item in items %}

<div class="card p-3 mb-3">

    {% if item.type == 'topic' %}
        <a href="/topic/{{ item.obj.id }}/">
            <strong>{{ item.title }}</strong>
        </a>
    {% else %}
        <a href="/poll/{{ item.obj.id }}/">
            <strong>{{ item.title }}</strong>
        </a>
    {% endif %}

    <div class="small text-muted mt-2">
        {{ item.updated|date:"Y-m-d H:i" }}
    </div>

</div>

{% empty %}
<p>No content</p>
{% endfor %}

{% endblock %}
