{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<h3>{% trans "Add comment" %}</h3>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        {{ form.title.label_tag }}
        {{ form.title }}
    </div>

    <div class="mb-3">
        {{ form.content.label_tag }}
        {{ form.content }}
    </div>

    <!-- ✅ ОДИН upload блок -->
    <div class="mb-3">
        <label>{% trans "Attachment" %}</label>

        <input type="file"
           name="file"
           id="file-input"
           class="d-none"
           multiple>

        <div id="drop-zone" class="drop-zone">
            {% trans "Click or Drag file here" %}
        </div>

        <div id="preview-box" class="mt-2"></div>
    </div>

    <button class="btn btn-success">
        {% trans "Save comment" %}
    </button>

    <a href="/topic/{{ topic.id }}/" class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>

</form>

{% endblock %}
