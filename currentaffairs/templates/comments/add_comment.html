{% extends 'base.html' %}
{% block content %}

<h3>Add comment</h3>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Save comment
    </button>

    <a href="/topic/{{ topic.id }}/" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
