{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<h3>{% trans "Add comment" %}</h3>

<form method="post"
      enctype="multipart/form-data"
      id="upload-form">

    {% csrf_token %}

    {{ form.title.label_tag }}
    {{ form.title }}

    {{ form.content.label_tag }}
    {{ form.content }}

    <div class="mb-3 mt-3">
        <label>{% trans "Attachment" %}</label>
        {{ form.file }}

        <div id="drop-zone" class="drop-zone mt-2">
            {% trans "Drag & Drop file here" %}
        </div>

        <div id="preview-box" class="mt-2"></div>
    </div>

    <button class="btn btn-success">
        {% trans "Save comment" %}
    </button>

    <a href="/topic/{{ topic.id }}/"
       class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>
</form>

{% endblock %}
