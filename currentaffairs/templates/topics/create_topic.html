{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<h3>{% trans "Create Topic" %}</h3>

<form method="post"
      enctype="multipart/form-data"
      id="upload-form">

    {% csrf_token %}

    <div class="mb-3">
        <label>{% trans "Title" %}</label>
        {{ form.title }}
    </div>

    <div class="mb-3">
        <label>{% trans "Description" %}</label>
        {{ form.description }}
    </div>

    <div class="mb-3">
        <label>{% trans "Content" %}</label>
        {{ form.content }}
    </div>

    <div class="mb-3">
        <label>{% trans "Attachment" %}</label>

        {{ form.file }}

        <div id="drop-zone" class="drop-zone mt-2">
            {% trans "Drag & Drop file here" %}
        </div>

        <div id="preview-box" class="mt-2"></div>
    </div>

    <div class="mb-3">
        <label>{% trans "Visibility" %}</label>
        {{ form.is_open }}
    </div>

    <div class="mb-3">
        <label>{% trans "Participants" %}</label>
        {{ form.participants }}
    </div>

    <button class="btn btn-success">{% trans "Save" %}</button>
    <a href="/home/" class="btn btn-secondary">{% trans "Cancel" %}</a>

</form>

{% endblock %}
