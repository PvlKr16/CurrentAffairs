{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Unread</h3>

    <div>
        <a href="?sort=oldest"
           class="btn btn-sm btn-outline-secondary">
            oldest
        </a>

        <a href="?sort=newest"
           class="btn btn-sm btn-outline-secondary">
            newest
        </a>
    </div>
</div>

{% for item in items %}

<div class="card p-3 mb-3">

    {% if item.type == 'topic' %}
        <a href="/topic/{{ item.obj.id }}/">
            <strong>{{ item.title }}</strong>
        </a>
    {% else %}
        <a href="/poll/{{ item.obj.id }}/">
            <strong>{{ item.title }}</strong>
        </a>
    {% endif %}

    <div class="small text-muted mt-2">
        {{ item.updated|date:"Y-m-d H:i" }}
    </div>

</div>

{% empty %}
<p>No unread items</p>
{% endfor %}

{% endblock %}
