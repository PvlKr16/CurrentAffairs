{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans "Login" %}</title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="{% static 'js/password-toggle.js' %}" defer></script>
</head>
<body class="auth-page">

<div class="login-shell">
    <div class="login-container shadow-sm">

        <div class="text-center mb-4">
            <h2 class="mb-1">CurrentAffairs</h2>
            <p class="text-muted small mb-0">
                {% trans "Sign in to continue" %}
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">{% trans "Email" %}</label>
                <input type="email"
                       name="username"
                       class="form-control"
                       placeholder="name@example.com"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">{% trans "Password" %}</label>

                <div class="input-group password-wrapper">
                    <input type="password"
                           name="password"
                           class="form-control password-input"
                           required>

                    <button type="button"
                            class="btn btn-outline-secondary password-peek">
                        👁
                    </button>
                </div>

                <small class="caps-warning text-danger d-none">
                    {% trans "Caps Lock is ON" %}
                </small>
            </div>

            <button type="submit" class="btn btn-success w-100">
                {% trans "Login" %}
            </button>
        </form>

    </div>
</div>

</body>
</html>
